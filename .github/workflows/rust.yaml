name: Build Release

# Builds release artifacts for Linux, Windows, and macOS (Intel + Apple Silicon).
# Runs on version tags (e.g. v1.0.0) and can also be triggered manually.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # needed for the release job to upload assets

env:
  BIN_NAME: minesweeper
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - label: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - label: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
          - label: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Linux needs GTK (for rfd's file dialog) and GL/X11 dev headers
      # (for the femtovg OpenGL renderer). Without these the build fails to link.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # ── Package: Linux ────────────────────────────────────────────────
      - name: Package Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "dist/${BIN_NAME}-${{ matrix.label }}"
          chmod +x "dist/${BIN_NAME}-${{ matrix.label }}"

      # ── Package: Windows ──────────────────────────────────────────────
      - name: Package Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$env:BIN_NAME.exe" "dist/$env:BIN_NAME-${{ matrix.label }}.exe"

      # ── Package: macOS (.app bundle inside a .dmg) ────────────────────
      - name: Package macOS
        if: matrix.os == 'macos-latest'
        run: |
          set -euo pipefail
          APP="${BIN_NAME}.app"
          mkdir -p "${APP}/Contents/MacOS" "${APP}/Contents/Resources"

          # Minimal Info.plist so it launches as a proper windowed app.
          cat > "${APP}/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>            <string>${BIN_NAME}</string>
            <key>CFBundleDisplayName</key>     <string>Minesweeper</string>
            <key>CFBundleExecutable</key>      <string>${BIN_NAME}</string>
            <key>CFBundleIdentifier</key>      <string>com.example.${BIN_NAME}</string>
            <key>CFBundleVersion</key>         <string>${GITHUB_REF_NAME#v}</string>
            <key>CFBundleShortVersionString</key><string>${GITHUB_REF_NAME#v}</string>
            <key>CFBundlePackageType</key>     <string>APPL</string>
            <key>LSMinimumSystemVersion</key>  <string>10.13</string>
            <key>NSHighResolutionCapable</key> <true/>
          </dict>
          </plist>
          PLIST

          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "${APP}/Contents/MacOS/${BIN_NAME}"
          chmod +x "${APP}/Contents/MacOS/${BIN_NAME}"

          # ad-hoc sign so Gatekeeper at least recognizes a signature
          # (this is NOT notarization; see notes below).
          codesign --force --deep --sign - "${APP}" || true

          brew install create-dmg
          mkdir -p dist
          create-dmg \
            --volname "${BIN_NAME}" \
            --window-size 500 300 \
            --icon-size 100 \
            --app-drop-link 360 120 \
            --icon "${APP}" 140 120 \
            "dist/${BIN_NAME}-${{ matrix.label }}.dmg" \
            "${APP}" \
          || create-dmg "dist/${BIN_NAME}-${{ matrix.label }}.dmg" "${APP}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  # ── Collect all artifacts and attach to a GitHub Release ─────────────
  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
